    border-radius: 999px;
    animation: pulsar 1.8s ease-in-out infinite;
    transition: transform .2s ease;
  }

  /* Ondas de brilho saindo do botão */
  .botao::before,
  .botao::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 2px solid var(--branco);
    opacity: 0;
    animation: onda 1.8s ease-out infinite;
    pointer-events: none;
  }
  .botao::after { animation-delay: .9s; }

  /* Reflexo que passa pelo botão */
  .botao span {
    position: relative;
    z-index: 1;
  }
  .brilho {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    pointer-events: none;
  }
  .brilho::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 40%;
    left: -60%;
    background: linear-gradient(100deg, transparent, rgba(0,0,0,.14), transparent);
    transform: skewX(-20deg);
    animation: reflexo 2.8s ease-in-out infinite;
  }

  .botao:hover { animation-play-state: paused; transform: scale(1.06); }
  .botao:active { transform: scale(.96); }
  .botao:focus-visible { outline: 3px solid var(--branco); outline-offset: 5px; }

  @keyframes pulsar {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  @keyframes onda {
    0%   { transform: scale(1);   opacity: .7; }
    100% { transform: scale(1.55, 1.9); opacity: 0; }
  }
  @keyframes reflexo {
    0%, 55% { left: -60%; }
    100%    { left: 130%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .botao, .botao::before, .botao::after, .brilho::before { animation: none; }
  }
</style>
</head>
<body>
  <main class="palco">
    <a id="cta" class="botao" href="#" rel="noopener">
      <span class="brilho"></span>
      <span>acessar oferta</span>
    </a>
  </main>

<script>
  // ==== CONFIGURE AQUI ====
  // Link da sua página de vendas / oferta
  var URL_DESTINO = "https://seguidoresbrasil.sbs/";
  // ========================

  // Repassa UTMs e demais parâmetros que chegaram na presell para o destino
  (function () {
    var btn = document.getElementById("cta");
    try {
      var destino = new URL(URL_DESTINO);
      new URLSearchParams(window.location.search).forEach(function (valor, chave) {
        if (!destino.searchParams.has(chave)) destino.searchParams.set(chave, valor);
      });
      btn.href = destino.toString();
    } catch (e) {
      btn.href = URL_DESTINO;
    }
  })();
</script>
</body>
</html>
